  </defs>
  <rect width="640" height="480" fill="url(#cm-sky)"/>
  <circle cx="560" cy="70" r="46" fill="#f5e9c8"/>
  <!-- joined arms ring -->
  <circle cx="320" cy="300" r="150" fill="none" stroke="#9fcdc0" stroke-width="10" stroke-dasharray="14 18" stroke-linecap="round"/>
  <circle cx="320" cy="300" r="112" fill="#bfe0d7"/>
  <path d="M0 380 Q160 330 320 370 T640 350 V480 H0 Z" fill="#2f8f7c" opacity="0.35"/>
  <!-- people figures -->
