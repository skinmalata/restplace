    <circle cx="372" cy="330" r="14" fill="#3fae97"/>
  </g>
  <!-- ground -->
  <rect x="0" y="400" width="640" height="80" fill="#f7fbfa"/>
  <rect x="0" y="400" width="640" height="14" fill="#88c4b6" opacity="0.5"/>
