    <g>
      <circle cx="196" cy="252" r="22" fill="#0b3d3a"/>
      <path d="M172 292 c0 -34 12 -42 24 -42 s24 8 24 42 c0 8 -6 12 -10 12 h-28 c-4 0 -10 -4 -10 -12 Z" fill="#0b3d3a"/>
    </g>
    <g>
