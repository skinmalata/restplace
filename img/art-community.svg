<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A group of friends in a warm circle of community">
  <defs>
    <linearGradient id="cm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6f3"/>
      <stop offset="1" stop-color="#cfe8e3"/>
