      <path d="M292 284 c0 -36 14 -46 28 -46 s28 10 28 46 c0 9 -7 14 -12 14 h-32 c-5 0 -12 -5 -12 -14 Z" fill="#124a45"/>
    </g>
    <g>
      <circle cx="444" cy="252" r="22" fill="#0b3d3a"/>
      <path d="M420 292 c0 -34 12 -42 24 -42 s24 8 24 42 c0 8 -6 12 -10 12 h-28 c-4 0 -10 -4 -10 -12 Z" fill="#0b3d3a"/>
    </g>
    <!-- children -->
